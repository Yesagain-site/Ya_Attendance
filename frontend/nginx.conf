server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point (hashed assets below cache forever),
    # so a redeploy is picked up immediately instead of serving stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API calls to the backend service (same-origin for the browser).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
